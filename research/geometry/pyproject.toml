[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftw-geometry"
version = "0.1.0"
description = "Independent polygon descriptors and geometry analysis; local extraction candidate"
requires-python = ">=3.12,<3.15"
dependencies = [
  "geopandas>=1,<2", "numpy>=1.24,<3", "pandas>=2,<4",
  "pyarrow>=21,<24", "pyproj>=3.6,<4", "rasterio>=1.3,<2",
  "shapely>=2,<3", "scipy>=1.11,<2"
]
[project.optional-dependencies]
visualization = ["matplotlib>=3.7,<4"]

[tool.hatch.build.targets.wheel]
packages = ["ftw_geometry"]
